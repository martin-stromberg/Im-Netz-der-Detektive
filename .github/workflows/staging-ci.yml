name: Pre-Release

on:
  push:
    branches:
      - staging

permissions:
  contents: write
  checks: write
  pull-requests: read

jobs:
  detect-backmerge:
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether this push is a pure back-merge from main
        id: check
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          main_sha="$(git rev-parse origin/main)"
          # A back-merge lands on staging as a merge commit whose SECOND parent
          # is main's tip (first parent is the previous staging tip). Checking
          # only the second parent avoids a false positive whenever staging
          # and main happen to point at the same commit.
          parents=($(git show -s --format=%P HEAD))
          second_parent="${parents[1]:-}"

          if [[ -n "$second_parent" && "$second_parent" == "$main_sha" ]]; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Back-merge from main detected - CI checks and pre-release will be skipped."
          elif git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pure back-merge from main detected (tree identical) - CI checks and pre-release will be skipped."
          else
            echo "is_backmerge=false" >> "$GITHUB_OUTPUT"
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          artifact-name: vulnerable-packages-staging

      - name: Static analysis
        run: |
          npm run lint
          npm run typecheck

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test with coverage
        # vitest enforces the 70% line-coverage threshold configured in
        # vite.config.ts (coverage.thresholds.lines) and fails the step when
        # the coverage drops below it.
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-staging
          path: coverage/
          retention-days: 14

  e2e:
    name: e2e (playwright, best-effort)
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Best-effort per the CI template (section 4): browser-driven tests
    # may flake on hosted runners, so a failure here never blocks the
    # pre-release — the traces uploaded below carry the evidence.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: npm run test:e2e

      - name: Upload Playwright traces
        # Traces land under test-results/ (playwright.config.ts keeps
        # them on failure). `always()` matters: evidence must exist even
        # when the step above already failed.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-staging
          path: test-results/
          retention-days: 14

  version:
    name: version
    needs: [detect-backmerge, static-checks, build-and-test]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.semver.outputs.changed }}
      version: ${{ steps.semver.outputs.version }}
      rc_tag: ${{ steps.rc.outputs.rc_tag }}
      rc_version: ${{ steps.rc.outputs.rc_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine next version
        # release.config.js only lists "main" as a release branch (see that
        # file's own comment) - staging is deliberately not a configured
        # prerelease branch there. The --branches override below treats
        # "staging" as a plain release branch for this one dry-run only, so
        # the resulting X.Y.Z carries no prerelease identifier - the RC suffix
        # is appended manually in the next step instead.
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dry-run must not load @semantic-release/github: its `assets` option
          # needs RELEASE_ASSET_PATH (set only by build-and-package) and
          # verifyConditions would fail with EINVALIDASSETS here.
          RESOLVE_DRY_RUN: "true"
        run: |
          set -o pipefail
          output="$(npx semantic-release --dry-run --no-ci --branches staging 2>&1 | tee /dev/stderr)"

          version=""
          changed="false"
          # Matches both "The next release version is X.Y.Z" and the first-
          # release phrasing "...the next release version is X.Y.Z".
          if [[ "$output" =~ next\ release\ version\ is\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?) ]]; then
            version="${BASH_REMATCH[1]}"
            changed="true"
          fi

          # Release-series pin: while `.release-series` exists, all staging
          # prereleases accumulate under the pinned version (vX.Y.Z-rc.N)
          # instead of following semantic-release's computed version. The
          # semantic-release output above still decides whether any
          # release-worthy commits exist ("changed").
          if [[ "$changed" == "true" && -f .release-series ]]; then
            version="$(tr -d '[:space:]' < .release-series)"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Determine RC number
        if: steps.semver.outputs.changed == 'true'
        id: rc
        run: |
          version="${{ steps.semver.outputs.version }}"
          rc_number=$(( $(git tag --list "v${version}-rc.*" | wc -l) + 1 ))
          echo "rc_number=$rc_number" >> "$GITHUB_OUTPUT"
          echo "rc_tag=v${version}-rc.${rc_number}" >> "$GITHUB_OUTPUT"
          # RC-suffixed version without the leading "v" (e.g. "1.2.3-rc.1"),
          # distinct from rc_tag ("v1.2.3-rc.1"). This exact output - not the
          # bare `version` above - must feed build-and-package's
          # release-version input in the job below. See
          # ci-workflows-instructions.md section 11.2.
          echo "rc_version=${version}-rc.${rc_number}" >> "$GITHUB_OUTPUT"

  prerelease:
    name: prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and package release candidate
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ needs.version.outputs.rc_version }}
          release-tag: ${{ needs.version.outputs.rc_tag }}

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.version.outputs.rc_tag }}"
          gh release create "$tag" release.zip \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --prerelease \
            --generate-notes
