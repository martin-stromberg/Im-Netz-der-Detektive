name: Security Scan

# Deliberately NOT triggered on pull_request - that duplication is exactly
# the kind of drift the shared composite action exists to avoid. The
# PR-blocking scan already happens inside static-checks; this file catches
# vulnerabilities disclosed after the last commit.
on:
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          artifact-name: vulnerable-packages-weekly
